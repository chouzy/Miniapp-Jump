name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build VSIX
        run: npx --yes @vscode/vsce package --out "miniapp-jump-${VERSION}.vsix"

      - name: Extract release notes
        run: node .github/scripts/extract-release-notes.mjs "${GITHUB_REF_NAME}" CHANGELOG.md RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: miniapp-jump-${{ env.VERSION }}.vsix
          body_path: RELEASE_NOTES.md
